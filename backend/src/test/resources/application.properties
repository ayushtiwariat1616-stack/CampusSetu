spring.application.name=campussetu-test
server.port=0
spring.profiles.active=test

spring.datasource.url=jdbc:h2:mem:campussetudb_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

campussetu.allowed-domain=kiet.edu
campussetu.dev-mode.enabled=true
campussetu.attachment.upload-dir=./target/test-storage/attachments
campussetu.academic.upload-dir=./target/test-storage/academics
campussetu.ai.api-key=
