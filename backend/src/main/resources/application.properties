spring.application.name=campussetu
server.port=8081

# Default active profile
spring.profiles.active=dev

# Persistent Database Configuration: Uses H2 file storage in PostgreSQL compatibility mode
# Survives application restarts, or can be overridden by standard SPRING_DATASOURCE_URL for external PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/campussetudb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}

# Server Session Configuration
server.servlet.session.cookie.name=CAMPUSSETU_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
server.servlet.session.timeout=120m

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# Google OAuth2 Client (Optional in dev, mandatory in prod)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:mock-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:mock-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google

# CampusSetu Custom Settings
campussetu.allowed-domain=kiet.edu
campussetu.attachment.upload-dir=./storage/attachments
campussetu.academic.upload-dir=./storage/academics
campussetu.dev-mode.enabled=true
campussetu.ai.api-key=${GEMINI_API_KEY:}