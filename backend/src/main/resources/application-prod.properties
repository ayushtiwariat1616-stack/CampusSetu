# Production Profile Configuration for CampusSetu
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/campussetu}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Enforce secure cookies in production (HTTPS only)
server.servlet.session.cookie.name=CAMPUSSETU_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=true

# Actuator: minimal public health
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Strict Production Guards: Dev demo mode MUST BE FALSE
campussetu.dev-mode.enabled=false
campussetu.allowed-domain=kiet.edu

# Production Google OAuth2 Client (must be supplied via env vars)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google

# Production persistent file storage
campussetu.attachment.upload-dir=${ATTACHMENT_STORAGE_DIR:/var/campussetu/attachments}
campussetu.academic.upload-dir=${ACADEMIC_STORAGE_DIR:/var/campussetu/academics}
campussetu.ai.api-key=${GEMINI_API_KEY:}
